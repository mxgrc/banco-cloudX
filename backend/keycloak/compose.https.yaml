# EC2 only. Use together with compose.yaml; retains the restored PostgreSQL volume.
services:
  keycloak:
    command: [start]
    environment:
      KC_HOSTNAME: https://auth.54-172-114-153.sslip.io
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx512m'
    mem_limit: 1g
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - /home/ec2-user/banco-cloud-frontend-dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 256m
volumes:
  caddy-data:
  caddy-config:
